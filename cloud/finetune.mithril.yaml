# PRESET — cloud/run.mithril.yaml specialized for Stage-3 finetuning. It only sets
# the right weight include and a default CMD; the runner itself (and its FIXED infra
# env surface) is identical to run.mithril.yaml. See that file for the rationale.
#
# Job knobs ride in the CMD string, so nothing here has to be kept in sync when you
# add one:
#   scripts/cloud/mithril_launch.sh cloud/finetune.mithril.yaml biom3-ft \
#     --env CMD="RUN_ID=ft1 EPOCHS=1 \
#                PRIMARY_HDF5=tests/_data/data/Stage2_MMD_swissprot_embedding_subset_1000.hdf5 \
#                bash scripts/cloud/finetune.sh --limit_val_batches 1.0"
#
# MULTI-NODE: set num_nodes > 1. finetune.sh reads SKYPILOT_NUM_NODES (forwarded by
# the runner) and dispatches to torchrun + DDP — cloud has no shared FS, so a single
# .ckpt is written by global rank 0, and the output push is gated to that node.
# Prefer PRIMARY_HDF5 / BIOM3_DATA_URI (identical bytes on every node) over
# on-the-fly CSV embedding.

resources:
  infra: mithril
  accelerators: A100:1        # PER-NODE GPUs

num_nodes: 1                  # >1 for multi-node

config:
  mithril:
    limit_price: 1.00

secrets:
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_SESSION_TOKEN: null

envs:
  CMD: "bash scripts/cloud/finetune.sh"   # override to set job knobs inline (see header)

  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  AWS_DEFAULT_REGION: us-east-2
  BIOM3_WEIGHTS_URI: s3://<WEIGHTS_BUCKET>/biom3/weights
  # Finetune-from-PRIMARY_HDF5 needs only proteoscribe. To embed a CSV (DATASET_CSV)
  # Stage 1 also loads the PenCL encoders, so append:
  #   "LLMs/esm2_t33_650M_UR50D* LLMs/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext/* PenCL/run1_base_pencl.ckpt* Facilitator/run1_base_facilitator.ckpt*"
  BIOM3_WEIGHTS_INCLUDES: "ProteoScribe/run1_base_proteoscribe.ckpt*"
  BIOM3_DATA_URI: ""
  BIOM3_OUTPUTS_PUSH_URI: ""
  WANDB_API_KEY: ""

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

run: |
  set -euo pipefail
  HEAD_IP="$(echo "${SKYPILOT_NODE_IPS:-}" | head -n1)"
  PUSH_URI=""
  if [ "${SKYPILOT_NODE_RANK:-0}" = "0" ]; then PUSH_URI="${BIOM3_OUTPUTS_PUSH_URI:-}"; fi
  sudo docker run --rm --gpus all --net=host --ipc=host \
    -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_DEFAULT_REGION \
    -e BIOM3_WEIGHTS_URI -e BIOM3_WEIGHTS_INCLUDES -e BIOM3_DATA_URI \
    -e BIOM3_OUTPUTS_PUSH_URI="$PUSH_URI" \
    -e MASTER_ADDR="$HEAD_IP" -e SKYPILOT_NODE_RANK -e SKYPILOT_NUM_NODES \
    -e WANDB_API_KEY \
    "$IMAGE" bash -lc "$CMD"
