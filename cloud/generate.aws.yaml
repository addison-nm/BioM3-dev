# TEMPLATE — BioM3 sequence generation (Stage-3 inference) on AWS, single- or
# multi-node. Same host-docker-pull job + envs as cloud/generate.mithril.yaml —
# only `resources` differ. See docs/setup/cloud_jobs.md.
#
# Launch with native sky (--secret redacts the creds in logs):
#   eval "$(aws configure export-credentials --format env)"
#   sky launch -c biom3-gen-$(date +%y%m%d-%H%M%S) cloud/generate.aws.yaml -y --down \
#     --secret AWS_ACCESS_KEY_ID \
#     --secret AWS_SECRET_ACCESS_KEY --secret AWS_SESSION_TOKEN
#
# MULTI-NODE: see cloud/generate.mithril.yaml (only Stage-3 sampling parallelizes;
# verify Facilitator determinism with a fixed SEED first).

resources:
  infra: aws/us-east-2         # provider/region (can't combine infra: with a separate region:)
  accelerators: A10G:1         # PER-NODE GPUs; NGPU below must match this count

num_nodes: 1                   # top-level (not under resources:); >1 for multi-node sampling

secrets:
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_SESSION_TOKEN: null

envs:
  # ── BioM3 job spec (edit per run) ────────────────────────────────────────────
  OUTPUT_PREFIX: sh3_gen_v1  # default; override via --env OUTPUT_PREFIX=... or --env-file
  NGPU: "1"
  FASTA: "true"
  SEED: "0"
  WEIGHT_SET: configs/weights/run1_base.json
  PROMPTS_CSV: ""            # e.g. data/your_prompts.csv (in-container path under /app)
  EXTRA_ARGS: ""             # extra flags forwarded verbatim to the sampler ("$@")

  # ── Infra / data staging (ECR image, AWS region, S3 URIs) ────────────────────
  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  AWS_DEFAULT_REGION: us-east-2
  # Generation needs the three stage weights AND the PenCL encoders (ESM-2 + BioBERT).
  BIOM3_WEIGHTS_URI: s3://<WEIGHTS_BUCKET>/biom3/weights
  BIOM3_WEIGHTS_INCLUDES: "LLMs/esm2_t33_650M_UR50D* LLMs/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext/* PenCL/run1_base_pencl.ckpt* Facilitator/run1_base_facilitator.ckpt* ProteoScribe/run1_base_proteoscribe.ckpt*"
  BIOM3_DATA_URI: ""
  BIOM3_OUTPUTS_PUSH_URI: ""
  WANDB_API_KEY: ""

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

run: |
  set -euo pipefail
  HEAD_IP="$(echo "${SKYPILOT_NODE_IPS:-}" | head -n1)"
  EFLAGS=(-e MASTER_ADDR="$HEAD_IP")
  for v in SKYPILOT_NODE_RANK SKYPILOT_NUM_NODES NGPU DEVICE OUTPUT_PREFIX \
           PROMPTS_CSV FASTA SEED WEIGHT_SET BATCH_SIZE MMD_SAMPLE_LIMIT \
           TOKEN_STRATEGY UNMASKING_ORDER \
           PENCL_WEIGHTS FACILITATOR_WEIGHTS PROTEOSCRIBE_WEIGHTS \
           AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION \
           BIOM3_WEIGHTS_URI BIOM3_WEIGHTS_INCLUDES BIOM3_DATA_URI \
           WANDB_API_KEY NCCL_DEBUG NCCL_SOCKET_IFNAME; do
    [ -n "${!v:-}" ] && EFLAGS+=(-e "$v=${!v}")
  done
  if [ "${SKYPILOT_NODE_RANK:-0}" = "0" ] && [ -n "${BIOM3_OUTPUTS_PUSH_URI:-}" ]; then
    EFLAGS+=(-e "BIOM3_OUTPUTS_PUSH_URI=$BIOM3_OUTPUTS_PUSH_URI")
  fi
  sudo docker run --rm --gpus all --net=host --ipc=host \
    "${EFLAGS[@]}" "$IMAGE" bash scripts/cloud/generate.sh ${EXTRA_ARGS:-}
