# PRESET — cloud/run.mithril.yaml specialized for generation (Stage-3 inference).
# It only sets the weight includes and a default CMD; the runner and its FIXED infra
# env surface are identical to run.mithril.yaml. See that file for the rationale.
#
# Job knobs ride in the CMD string:
#   scripts/cloud/mithril_launch.sh cloud/generate.mithril.yaml biom3-gen \
#     --env CMD="OUTPUT_PREFIX=gen1 \
#                PROMPTS_CSV=tests/_data/stage1_inputs/sample_text_seqs1.csv \
#                bash scripts/cloud/generate.sh"
# (the prompts CSV must have the columns the PenCL config expects:
#  protein_sequence + primary_Accession)
#
# MULTI-NODE: set num_nodes > 1. Only Stage-3 sampling parallelizes (the sampler
# shards by rank; only rank 0 writes). NOTE: stages 1-2 run per node and Facilitator
# sampling is stochastic — verify determinism with a fixed SEED before trusting
# multi-node output. Validate multi-node finetuning first.

resources:
  infra: mithril
  accelerators: A100:1        # PER-NODE GPUs

num_nodes: 1                  # >1 for multi-node sampling

config:
  mithril:
    limit_price: 1.00

secrets:
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_SESSION_TOKEN: null

envs:
  CMD: "bash scripts/cloud/generate.sh"   # override to set job knobs inline (see header)

  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  AWS_DEFAULT_REGION: us-east-2
  # Generation needs the three stage weights AND the PenCL encoders (ESM-2 + BioBERT)
  # that Stage 1 loads at init. The esm2 glob also grabs its -contact-regression
  # companion, which ESM loading requires.
  BIOM3_WEIGHTS_URI: s3://<WEIGHTS_BUCKET>/biom3/weights
  BIOM3_WEIGHTS_INCLUDES: "LLMs/esm2_t33_650M_UR50D* LLMs/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext/* PenCL/run1_base_pencl.ckpt* Facilitator/run1_base_facilitator.ckpt* ProteoScribe/run1_base_proteoscribe.ckpt*"
  BIOM3_DATA_URI: ""
  BIOM3_OUTPUTS_PUSH_URI: ""
  WANDB_API_KEY: ""

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

run: |
  set -euo pipefail
  HEAD_IP="$(echo "${SKYPILOT_NODE_IPS:-}" | head -n1)"
  PUSH_URI=""
  if [ "${SKYPILOT_NODE_RANK:-0}" = "0" ]; then PUSH_URI="${BIOM3_OUTPUTS_PUSH_URI:-}"; fi
  sudo docker run --rm --gpus all --net=host --ipc=host \
    -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_DEFAULT_REGION \
    -e BIOM3_WEIGHTS_URI -e BIOM3_WEIGHTS_INCLUDES -e BIOM3_DATA_URI \
    -e BIOM3_OUTPUTS_PUSH_URI="$PUSH_URI" \
    -e MASTER_ADDR="$HEAD_IP" -e SKYPILOT_NODE_RANK -e SKYPILOT_NUM_NODES \
    -e WANDB_API_KEY \
    "$IMAGE" bash -lc "$CMD"
