# PRESET — cloud/run.mithril.yaml specialized for Stage-3 pretraining FROM SCRATCH.
# From-scratch needs no pretrained weights, so the weight include is empty; the
# runner and its FIXED infra env surface are identical to run.mithril.yaml.
#
# Job knobs ride in the CMD string:
#   scripts/cloud/mithril_launch.sh cloud/pretrain.mithril.yaml biom3-pt \
#     --env CMD="RUN_ID=pt1 EPOCHS=1 \
#                PRIMARY_HDF5=tests/_data/data/Stage2_MMD_swissprot_embedding_subset_1000.hdf5 \
#                bash scripts/cloud/pretrain.sh --limit_val_batches 1.0"
#
# Provide the precompiled Stage-2 embedding HDF5 via BIOM3_DATA_URI (synced to
# /app/data on every node) — or point PRIMARY_HDF5 at one baked into the image.
# MULTI-NODE: set num_nodes > 1; pretrain.sh reads SKYPILOT_NUM_NODES (forwarded)
# and dispatches to torchrun + DDP (single .ckpt from global rank 0).

resources:
  infra: mithril
  accelerators: A100:1        # PER-NODE GPUs

num_nodes: 1                  # >1 for multi-node

config:
  mithril:
    limit_price: 1.00

secrets:
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_SESSION_TOKEN: null

envs:
  CMD: "bash scripts/cloud/pretrain.sh"   # override to set job knobs inline (see header)

  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  AWS_DEFAULT_REGION: us-east-2
  # From-scratch needs no pretrained weights -> empty URI, so the entrypoint skips
  # the sync entirely. (A URI with an empty INCLUDES would pull the whole ~40 GB tree.)
  BIOM3_WEIGHTS_URI: ""
  BIOM3_WEIGHTS_INCLUDES: ""
  BIOM3_DATA_URI: ""
  BIOM3_OUTPUTS_PUSH_URI: ""
  WANDB_API_KEY: ""

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

run: |
  set -euo pipefail
  HEAD_IP="$(echo "${SKYPILOT_NODE_IPS:-}" | head -n1)"
  PUSH_URI=""
  if [ "${SKYPILOT_NODE_RANK:-0}" = "0" ]; then PUSH_URI="${BIOM3_OUTPUTS_PUSH_URI:-}"; fi
  sudo docker run --rm --gpus all --net=host --ipc=host \
    -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_DEFAULT_REGION \
    -e BIOM3_WEIGHTS_URI -e BIOM3_WEIGHTS_INCLUDES -e BIOM3_DATA_URI \
    -e BIOM3_OUTPUTS_PUSH_URI="$PUSH_URI" \
    -e MASTER_ADDR="$HEAD_IP" -e SKYPILOT_NODE_RANK -e SKYPILOT_NUM_NODES \
    -e WANDB_API_KEY \
    "$IMAGE" bash -lc "$CMD"
