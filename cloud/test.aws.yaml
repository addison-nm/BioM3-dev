# TEMPLATE — BioM3 test suite on AWS (SkyPilot). Same host-docker-pull job as
# cloud/test.mithril.yaml — only `resources` differ. See docs/setup/cloud_jobs.md.
#
# Launch with native sky (--secret redacts the creds in logs):
#   eval "$(aws configure export-credentials --format env)"
#   sky launch -c biom3-test-$(date +%y%m%d-%H%M%S) cloud/test.aws.yaml -y --down \
#     --secret AWS_ACCESS_KEY_ID \
#     --secret AWS_SECRET_ACCESS_KEY --secret AWS_SESSION_TOKEN

resources:
  infra: aws/us-east-2         # provider/region (can't combine infra: with a separate region:)
  accelerators: L4:1           # any single GPU exercises the CUDA path

secrets:
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_SESSION_TOKEN: null

envs:
  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  PYTEST_ARGS: tests/ --use_gpu
  BIOM3_WEIGHTS_URI: s3://<WEIGHTS_BUCKET>/biom3/weights
  BIOM3_WEIGHTS_INCLUDES: "LLMs/esm2_t33_650M_UR50D* LLMs/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext/* PenCL/BioM3_PenCL_epoch20.bin PenCL/PenCL_V09152023_last.ckpt* Facilitator/BioM3_Facilitator_epoch20.bin ProteoScribe/BioM3_ProteoScribe_pfam_epoch20_v1*.bin ProteoScribe/epoch200_full.ckpt/single_model.pth"
  AWS_DEFAULT_REGION: us-east-2

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

run: |
  set -euo pipefail
  sudo docker run --rm --gpus all \
    -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
    -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
    -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
    -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
    -e BIOM3_WEIGHTS_URI="$BIOM3_WEIGHTS_URI" \
    -e BIOM3_WEIGHTS_INCLUDES="$BIOM3_WEIGHTS_INCLUDES" \
    "$IMAGE" pytest $PYTEST_ARGS
