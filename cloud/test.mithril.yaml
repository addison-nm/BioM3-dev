# BioM3 test suite on Mithril — host-docker-pull (no image_id: that needs an
# in-container SSH on port 10022, which Mithril doesn't expose). Launched via the
# bundled sky CLI (`mithril sky launch`), which supports --secret (redacted) and
# fills `secrets: null`. The image is PUBLIC on GHCR (anonymous pull); AWS creds are
# only for the container's S3 weight-sync.
#
# Launch (unique cluster name — Mithril retains bid names, so reuse fails misleadingly):
#   scripts/cloud/mithril_launch.sh cloud/test.mithril.yaml biom3-test
# or explicitly:
#   eval "$(aws configure export-credentials --format env)"
#   mithril sky launch -c biom3-test-$(date +%y%m%d-%H%M%S) cloud/test.mithril.yaml -y --down \
#     --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY --secret AWS_SESSION_TOKEN
#
# Data-free variant: drop BIOM3_WEIGHTS_* and set PYTEST_ARGS="tests/ --quick --use_gpu".

resources:
  infra: mithril
  accelerators: A100:1

config:
  mithril:
    limit_price: 1.00

secrets:
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_SESSION_TOKEN: null

envs:
  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  PYTEST_ARGS: tests/ --use_gpu
  BIOM3_WEIGHTS_URI: s3://<WEIGHTS_BUCKET>/biom3/weights
  BIOM3_WEIGHTS_INCLUDES: "LLMs/esm2_t33_650M_UR50D* LLMs/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext/* PenCL/BioM3_PenCL_epoch20.bin PenCL/PenCL_V09152023_last.ckpt* Facilitator/BioM3_Facilitator_epoch20.bin ProteoScribe/BioM3_ProteoScribe_pfam_epoch20_v1*.bin ProteoScribe/epoch200_full.ckpt/single_model.pth"
  AWS_DEFAULT_REGION: us-east-2

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

run: |
  set -euo pipefail
  sudo docker run --rm --gpus all \
    -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
    -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
    -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
    -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
    -e BIOM3_WEIGHTS_URI="$BIOM3_WEIGHTS_URI" \
    -e BIOM3_WEIGHTS_INCLUDES="$BIOM3_WEIGHTS_INCLUDES" \
    "$IMAGE" pytest $PYTEST_ARGS
